
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLASH KEY STORE Payment</title>
<style>
body{margin:0;background:#101827;color:white;font-family:Arial,sans-serif;padding:20px}
.card{max-width:420px;margin:30px auto;background:#1d293b;padding:25px 20px;border-radius:20px;text-align:center;box-sizing:border-box}
h1{font-size:25px}
.amount{font-size:40px;font-weight:bold;margin:25px 0}
p{line-height:1.6;color:#d4dceb}
button,a{display:block;width:100%;box-sizing:border-box;padding:16px;margin-top:14px;border:0;border-radius:12px;font-size:17px;font-weight:bold;text-decoration:none}
.pay{background:#19a768;color:white}
.copy{background:#34445c;color:white}
#status{color:#ffbcbc}
</style>
</head>
<body>
<div class="card">
  <div style="font-size:42px">🔐</div>
  <h1>FLASH KEY STORE</h1>
  <p>सुरक्षित UPI Payment</p>
  <div class="amount" id="amount">₹50.00</div>
  <p id="plan">Plan: 1 Day</p>

  <a class="pay" id="pay" href="#">💸 Pay Now</a>
  <button class="copy" id="copy">📋 Copy UPI ID</button>
  <p id="status">UPI ऐप खोलने के लिए Pay Now दबाएँ।</p>
  <p>पेमेंट के बाद UTR भेजें। Admin द्वारा भुगतान की पुष्टि के बाद ही Key मिलेगी।</p>
</div>

<script>
(function(){
  const UPI_ID = "dk2337@ibl";
  const PAYEE = "Dinesh Kumar";

  const params = new URLSearchParams(location.search);
  const plan = params.get("plan") || "1 Day";
  const amount = Number(params.get("am") || "50");
  const requestedUPI = params.get("pa");

  const prices = {
    "1 Day": 50,
    "3 Days": 150,
    "7 Days": 300
  };

  const valid = Object.prototype.hasOwnProperty.call(prices, plan)
    && amount === prices[plan]
    && (!requestedUPI || requestedUPI === UPI_ID);

  const status = document.getElementById("status");
  const pay = document.getElementById("pay");

  if (!valid) {
    pay.style.display = "none";
    status.textContent = "प्लान, राशि या UPI ID मेल नहीं खा रही। Telegram से दोबारा खोलें।";
    return;
  }

  document.getElementById("amount").textContent = "₹" + amount.toFixed(2);
  document.getElementById("plan").textContent = "Plan: " + plan;

  const upiURL = "upi://pay?" + new URLSearchParams({
    pa: UPI_ID,
    pn: PAYEE,
    am: amount.toFixed(2),
    cu: "INR",
    tn: "FLASH KEY STORE " + plan
  }).toString();

  pay.href = upiURL;

  document.getElementById("copy").addEventListener("click", async function(){
    try {
      await navigator.clipboard.writeText(UPI_ID);
      this.textContent = "✅ UPI ID कॉपी हो गई";
    } catch(e) {
      status.textContent = "UPI ID: " + UPI_ID;
    }
  });
})();
</script>
</body>
</html>
